x-company-aws-cli-cache: &company_aws_cli_cache
  - /home/worker/.aws/cli/cache:uid=1000,gid=1000,mode=0700

services:
  http-gate:
    tmpfs: *company_aws_cli_cache
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /runtime/source/current/codex-backend-sdk
    entrypoint: [sh, -c]
    command:
      - |
        while ! test -f /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-source-generation; do sleep 2; done
        exec python3 /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-source-generation \
          --script cognilode-http-gate --drain-socket /runtime/http-gate/gate.sock --no-drain -- \
          --socket /runtime/http-gate/gate.sock --state /runtime/http-gate \
          --fallback-log /runtime/http-gate/fallback.jsonl \
          --environment ${COGNILODE_ENVIRONMENT_ID} --aws /usr/bin/aws
    environment:
      HOME: /home/worker
      COGNILODE_HTTP_GATE_BYPASS: "1"
      COGNILODE_AWS_PURPOSE: secrets-read
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - company_operator:/home/worker/.config/cognilode:ro
      - company_deploy_custody:/deploy:ro
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro

  credential-sync:
    tmpfs: *company_aws_cli_cache
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /runtime/source/current/codex-backend-sdk
    entrypoint: [python3, /runtime/source/current/codex-backend-sdk/scripts/cognilode-central-credential-sync]
    command:
      - --credential
      - cognilode/chatmode/codex-auth=/home/worker/.codex/auth.json
      - --credential
      - cognilode/http-gate-operator-token=/home/worker/.config/cognilode/operator-bearer
      - --credential
      - cognilode/population/authority/cloudflare-pages-deploy-token=/deploy/pages-token.json
      - --credential
      - /cognilode/agent-credentials/cloudflare/full-admin=/deploy/worker-token.json
      - --credential
      - cognilode/http-gate-operator-token=/deploy/operator-bearer
      - --credential
      - ${COGNILODE_RELAY_NODE_SECRET_ID:-cognilode/remote-shell/node}=/relay/node.json
      - --credential
      - ${COGNILODE_RELAY_TUNNEL_SECRET_ID:-cognilode/remote-shell/tunnel-token}=/relay/tunnel-token
      - --credential
      - cognilode/memory-drive/rclone-config#rclone_config=/memory-auth/rclone.conf
      - --credential
      - cognilode/google-drive/rollout-service-account=/deploy/drive-rollout.json
      - --credential
      - /cognilode/agent-credentials/github/owner=/deploy/github-owner.json
      - --writer-secret
      - cognilode/chatmode/codex-auth
      - --writer-secret
      - cognilode/memory-drive/rclone-config
    environment:
      HOME: /home/worker
      COGNILODE_AWS_PURPOSE: secrets-write
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime:ro
      - company_auth:/home/worker/.codex
      - company_operator:/home/worker/.config/cognilode
      - company_deploy_custody:/deploy
      - company_relay_custody:/relay
      - memory_drive_auth:/memory-auth
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro

  # The only company browser that may hold provider login state.  Provider
  # adapters receive CDP access to this process after redeeming an opaque
  # operation lease; they never receive cookies or a copied profile.  Keeping
  # the browser beside the transport in Compose replaces the former host-side
  # bootstrap browser and makes custody survive source generations.
  provider-browser:
    image: ${COGNILODE_BROWSER_IMAGE:-362928919715.dkr.ecr.us-west-2.amazonaws.com/cognilode-always-on-node:20261002-v2}
    restart: unless-stopped
    # Docker bridge forwarding is intentionally disabled on company hosts.
    # Provider navigation therefore shares the host network just like the
    # mutation transport. DevTools remains loopback-only and is reachable only
    # by the host-network provider actuator population.
    network_mode: host
    shm_size: 1gb
    tmpfs:
      - /run/provider-browser:size=6g,mode=0700
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        durable=/custody/browser/profile
        profile=/run/provider-browser/profile
        mkdir -p "$$durable" "$$profile" /custody/browser/downloads
        # Materialize only authentication/session state. Provider caches,
        # models, histories and metrics can be gigabytes and previously kept
        # Chrome in uninterruptible volume I/O long enough to miss queue slots.
        for item in 'Local State' Default/Cookies Default/Cookies-journal \
          Default/Preferences Default/'Secure Preferences'; do
          if test -e "$$durable/$$item"; then
            mkdir -p "$$profile/$$(dirname "$$item")"
            cp -a "$$durable/$$item" "$$profile/$$item"
          fi
        done
        find "$$profile" -maxdepth 1 -name 'Singleton*' -delete
        chrome=$$(find /root/.cache/ms-playwright -path '*/chrome-linux64/chrome' -type f -perm -111 | head -n 1)
        test -n "$$chrome"
        Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp & xvfb=$$!
        export DISPLAY=:99
        "$$chrome" --user-data-dir="$$profile" --remote-debugging-port=9333 \
          --remote-allow-origins='*' \
          --disable-dev-shm-usage --no-first-run --no-default-browser-check \
          --no-sandbox --ozone-platform=x11 --disable-gpu-compositing \
          --disable-features=UsePortalFilePicker,EnableBoundSessionCredentials,DeviceBoundSessionCredentials,BoundSessionCredentials \
          --window-size=1600,1000 https://gemini.google.com/app &
        child=$$!
        persist() {
          for item in 'Local State' Default/Cookies Default/Cookies-journal \
            Default/Preferences Default/'Secure Preferences'; do
            if test -e "$$profile/$$item"; then
              mkdir -p "$$durable/$$(dirname "$$item")"
              cp -a "$$profile/$$item" "$$durable/$$item"
            fi
          done
        }
        trap 'kill -TERM "$$child" "$$xvfb" 2>/dev/null || true; wait "$$child" || true; persist' TERM INT
        while ! python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:9333/json/version",timeout=2).read()'; do
          kill -0 "$$child"
          sleep 1
        done
        # Chrome deliberately binds DevTools to loopback.  Export it through a
        # byte-transparent asyncio relay.  The first implementation used two
        # unsynchronised threads and could close the upstream socket after the
        # WebSocket upgrade while its peer was still writing, yielding a
        # successful handshake followed by a silent CDP timeout.
        python3 -c 'import asyncio
        async def pipe(reader,writer):
          try:
            while True:
              data=await reader.read(65536)
              if not data: break
              writer.write(data); await writer.drain()
          except (ConnectionError,asyncio.CancelledError): pass
          try: writer.write_eof()
          except (OSError,AttributeError): pass
        async def serve(reader,writer):
          try:
            head=await reader.readuntil(b"\r\n\r\n")
            lines=head.split(b"\r\n")
            lines=[b"Host: 127.0.0.1:9333" if x.lower().startswith(b"host:") else x for x in lines]
            upstream_reader,upstream_writer=await asyncio.open_connection("127.0.0.1",9333)
            upstream_writer.write(b"\r\n".join(lines)); await upstream_writer.drain()
            await asyncio.gather(pipe(reader,upstream_writer),pipe(upstream_reader,writer),return_exceptions=True)
            upstream_writer.close(); await upstream_writer.wait_closed()
          except (Exception,asyncio.CancelledError): pass
          writer.close()
          try: await writer.wait_closed()
          except Exception: pass
        async def main():
          server=await asyncio.start_server(serve,"127.0.0.1",9334)
          async with server: await server.serve_forever()
        asyncio.run(main())' & relay=$$!
        wait "$$child"
        kill -TERM "$$relay" 2>/dev/null || true
        kill -TERM "$$xvfb" 2>/dev/null || true
        persist
    volumes:
      - company_browser:/custody/browser

  provider-transport:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    # Docker must not SIGKILL an accepted in-turn send while Compose is
    # applying a source generation. Scheduler effect leases are at least an
    # hour; the supervisor additionally waits for terminal receipts.
    stop_grace_period: 2h
    # Docker bridge forwarding is intentionally unavailable on the host.  The
    # credential-bearing transport must nevertheless reach provider mutation
    # endpoints; use the host network rather than silently timing every ChatGPT
    # prepare request out after sixty seconds.  All local control planes remain
    # Unix sockets or loopback-bound services.
    network_mode: host
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    cpus: 1
    mem_limit: 2g
    pids_limit: 192
    working_dir: /runtime/source/current/codex-backend-sdk
    entrypoint: [sh, -c]
    command:
      - |
        while ! test -f /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-source-generation; do sleep 2; done
        exec python3 /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-source-generation --script cognilode-provider-transport --drain-socket /runtime/provider.sock -- --socket /runtime/provider.sock
    environment:
      HOME: /home/worker
      CODEX_HOME: /home/worker/.codex
      COGNILODE_CHATMODE_PORTABLE: "1"
      PYTHONPATH: /runtime/source/current/codex-backend-sdk/gate
      COGNILODE_HTTP_GATE_SOCKET: /runtime/http-gate/gate.sock
      COGNILODE_HTTP_GATE_FALLBACK_LOG: /runtime/http-gate/fallback.jsonl
      COGNILODE_HTTP_GATE_POLICY_FILE: /runtime/http-gate/policy.json
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
      COGNILODE_ENVIRONMENT_ID: ${COGNILODE_ENVIRONMENT_ID}
      COGNILODE_GENERATION_MANIFEST_ROOT: /runtime/provider-generations
      # The generation supervisor must consult the same durable scheduler
      # ledger as queue workers before exiting an incumbent provider process.
      # This also source-converges the already-running transport container;
      # host reconciliation defers its replacement until all effect leases
      # reach terminal receipt or their real scheduler expiry.
      COGNILODE_PROVIDER_SCHEDULER_DB: /runtime/provider-scheduler/scheduler.sqlite3
      COMPUTERUSEX_CDP_ENDPOINT: ${COMPUTERUSEX_CDP_ENDPOINT:-http://127.0.0.1:9334}
      # Provider receipts, network captures and returned physical artifacts
      # must survive immutable chatmode container rotation.  ComputerUseX's
      # default ~/.local/state path is not a custody mount in this service.
      COMPUTERUSEX_RUNTIME_ROOT: /home/worker/.local/share/cognilode/computerusex
      AGENT_MEMORY_ENDPOINT: http://127.0.0.1:8098/v1/conversations
      AGENT_MEMORY_INGEST_ENDPOINT: http://127.0.0.1:8098/v1/conversations/ingest
      AGENT_MEMORY_INVENTORY_ENDPOINT: http://127.0.0.1:8098/v1/inventory/events
      PATH: /node-runtime:/usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - company_node_runtime:/node-runtime:ro
      - company_auth:/home/worker/.codex
      - company_browser:/custody/browser:ro
      - company_operator:/home/worker/.config/cognilode:ro
      - ${COMPANY_RUNTIME_ROOT}/worker:/home/worker/.local/share/cognilode
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
    depends_on:
      - http-gate
      - credential-sync
      - memory
      - provider-browser

  provider-scheduler:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /runtime/source/current/control-execution-runtime
    entrypoint: [sh, -c]
    command:
      - |
        while true; do
          while ! test -f /runtime/source/current/control-execution-runtime/scripts/cognilode-provider-scheduler; do sleep 2; done
          source=$$(readlink -f /runtime/source/current/control-execution-runtime)
          PYTHONPATH="$$source/src" python3 "$$source/scripts/cognilode-provider-scheduler" & child=$$!
          while kill -0 $$child 2>/dev/null && test "$$(readlink -f /runtime/source/current/control-execution-runtime)" = "$$source"; do sleep 2; done
          kill -TERM $$child 2>/dev/null || true
          wait $$child 2>/dev/null || true
          sleep 1
        done
    environment:
      HOME: /home/worker
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_PROVIDER_SCHEDULER_SOCKET: /runtime/provider-scheduler.sock
      COGNILODE_PROVIDER_SCHEDULER_DB: /runtime/provider-scheduler/scheduler.sqlite3
      COGNILODE_PROVIDER_SCHEDULER_LEDGER: /runtime/provider-events/outbox.jsonl
      COGNILODE_PROVIDER_RHYTHM_TAPE: /runtime/source/current/control-execution-runtime/data/provider_scheduler/historical_rhythm.uleb128
      # Area 2 has one source-converged clock caller below.  Keep the scheduler
      # as the authority while disabling its optional embedded clock thread.
      COGNILODE_PROVIDER_CLOCK_DRIVER: external
    volumes:
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
    depends_on:
      - source-sync

  provider-clock:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /runtime/source/current/codex-backend-sdk
    entrypoint: [sh, -c]
    command:
      - |
        while ! test -f /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-source-generation; do sleep 2; done
        exec python3 /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-source-generation \
          --script cognilode-chatmode-floor-watcher --drain-socket /runtime/provider-clock.no-drain --no-drain
    environment:
      HOME: /home/worker
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_PROVIDER_SCHEDULER_SOCKET: /runtime/provider-scheduler.sock
      COGNILODE_PROVIDER_SOCKET: /runtime/provider.sock
      COGNILODE_RHYTHM_STATUS_ROOT: /runtime/rhythm-status
      COGNILODE_HOSTED_RHYTHM_PROVIDERS: "chatgpt.com,gemini.com,claude.com,anthropic.com"
      COGNILODE_ENVIRONMENT_ID: ${COGNILODE_ENVIRONMENT_ID}
    volumes:
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
    depends_on:
      - provider-scheduler
      - provider-transport
      - source-sync

  chatmode:
    tmpfs: *company_aws_cli_cache
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    stop_grace_period: 2h
    # Queue actuators share provider-browser's loopback custody endpoint and
    # require provider egress; the host firewall already blocks Docker bridge
    # forwarding. Control planes remain loopback or Unix-socket scoped.
    network_mode: host
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    cpus: 1
    mem_limit: 2g
    pids_limit: 192
    working_dir: /runtime
    entrypoint: [sh, -c]
    command:
      - >-
        while ! test -f /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-chatmode-runtime; do sleep 2; done;
        exec python3 /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-chatmode-runtime
    environment:
      HOME: /home/worker
      COGNILODE_CHATMODE_PORTABLE: "1"
      COGNILODE_CHATMODE_RUNTIME_EPOCH: bounded-drain-20261010
      COGNILODE_CHATMODE_DRAIN_GRACE_SECONDS: "120"
      # Provider populations have independent clocks and workers.  Keep every
      # native fallback available so a broken ChatGPT route cannot prevent
      # Gemini, Claude, or Anthropic from repairing it.
      # The provider population is desired state, not a host bootstrap option.
      # A stale host override previously collapsed this back to ChatGPT-only
      # and made the independent Gemini/Claude/Anthropic queues inert.
      COGNILODE_HOSTED_RHYTHM_PROVIDERS: "chatgpt.com,gemini.com,claude.com,anthropic.com"
      # The centrally-custodied provider browser is attached to the company
      # network; provider actuators must never fall back to a host/personal
      # browser on the unrelated Docker bridge.
      COMPUTERUSEX_CDP_ENDPOINT: ${COMPUTERUSEX_CDP_ENDPOINT:-http://127.0.0.1:9334}
      AGENT_MEMORY_ENDPOINT: http://127.0.0.1:8098/v1/conversations
      AGENT_MEMORY_INGEST_ENDPOINT: http://127.0.0.1:8098/v1/conversations/ingest
      AGENT_MEMORY_INVENTORY_ENDPOINT: http://127.0.0.1:8098/v1/inventory/events
      PYTHONPATH: /runtime/source/current/codex-backend-sdk/gate:/runtime/source/current/modified-codex-runtime/src
      COGNILODE_HTTP_GATE_SOCKET: /runtime/http-gate/gate.sock
      COGNILODE_HTTP_GATE_FALLBACK_LOG: /runtime/http-gate/fallback.jsonl
      COGNILODE_HTTP_GATE_POLICY_FILE: /runtime/http-gate/policy.json
      COGNILODE_PROVIDER_SOCKET: /runtime/provider.sock
      COGNILODE_CHATMODE_WORK_ROOT: /home/worker/.local/share/cognilode/b4pt0r-chatmode
      COGNILODE_RETURNED_PRODUCT_ADMISSIONS: /home/worker/.local/share/cognilode/returned-products/admission-intents
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
      COGNILODE_ENVIRONMENT_ID: ${COGNILODE_ENVIRONMENT_ID}
      COGNILODE_COMPANY_ROOT: /company
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_B4PT0R_SDK_ROOT: /runtime/source/current/codex-backend-sdk
      COGNILODE_UNIFIED_PROMPTER: /runtime/source/current/modified-codex-runtime/src/modified_codex/unified_bridge.py
      COMPUTERUSEX_MODIFIED_CODEX: /codex/bin/codex
      COMPUTERUSEX_CODEX_STATE: /home/worker/.local/share/cognilode/computerusex/modified-codex
      COGNILODE_TASKFLOW_ATTACHMENT_S3_BUCKET: cognilode-ephemeral-artifacts-362928919715-us-west-2
      COGNILODE_TASKFLOW_ATTACHMENT_S3_READ_BUCKETS: cognilode-conversation-visibility-362928919715-us-west-2
      COGNILODE_AWS_CLI: /usr/bin/aws
      COGNILODE_AWS_PURPOSE: artifact-write
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - company_operator:/home/worker/.config/cognilode:ro
      - ${COMPANY_RUNTIME_ROOT}/worker:/home/worker/.local/share/cognilode
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - company_codex_release:/codex:ro
      - company_auth:/home/worker/.codex
      - memory_data:/runtime/agent-memory:ro
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro
    depends_on:
      - provider-transport
      - source-sync
      - provider-scheduler

  source-sync:
    tmpfs: *company_aws_cli_cache
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /runtime/source/current/codex-backend-sdk
    entrypoint: [python3, /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-source-sync]
    environment:
      HOME: /home/worker
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_ENVIRONMENT_ID: ${COGNILODE_ENVIRONMENT_ID:-evanpc-company-container}
      COGNILODE_SOURCE_SYNC_INTERVAL: "30"
      COGNILODE_SOURCE_SYNC_GENERATION: full-history-v1
      COGNILODE_AWS_PURPOSE: secrets-read
      COGNILODE_GITHUB_CREDENTIAL_FILE: /deploy/github-owner.json
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - company_operator:/home/worker/.config/cognilode:ro
      - company_deploy_custody:/deploy:ro
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro

  codex-release-custody:
    tmpfs: *company_aws_cli_cache
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "0:0"
    working_dir: /runtime/source/current/codex-backend-sdk
    entrypoint: [python3, /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-codex-release-custody-runtime]
    environment:
      HOME: /tmp/cognilode-codex-release-custody
      AWS_CONFIG_FILE: /root/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_CODEX_INSTALL_ROOT: /codex
      COGNILODE_ENVIRONMENT_ID: ${COGNILODE_ENVIRONMENT_ID:-evanpc-company-container}
      COGNILODE_CODEX_RELEASE_BUCKET: cognilode-ephemeral-artifacts-362928919715-us-west-2
      COGNILODE_CODEX_INSTALLATION_LEDGER: /runtime-events/source-convergence.jsonl
      COGNILODE_AWS_CLI: /usr/bin/aws
      COGNILODE_AWS_PURPOSE: artifact-write
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime:ro
      - ${COMPANY_RUNTIME_ROOT}/shared/source/events/source-convergence.jsonl:/runtime-events/source-convergence.jsonl:rw
      - company_operator:/home/worker/.config/cognilode:ro
      - ${AWS_AUTH_ROOT}:/root/.aws:ro
      - company_codex_release:/codex

  codex-builder:
    image: rust:1.95-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
    restart: unless-stopped
    network_mode: bridge
    user: "0:0"
    working_dir: /runtime/source/current/codex-backend-sdk
    entrypoint: [python3, /runtime/source/current/codex-backend-sdk/scripts/cognilode-company-codex-builder]
    environment:
      HOME: /root
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_CODEX_INSTALL_ROOT: /codex
      COGNILODE_BUILDER_GENERATION: synced-resolved-pin-v2
      COGNILODE_CODEX_MIN_BUILD_MEMORY_BYTES: "5368709120"
      COGNILODE_CODEX_LEGACY_RELEASE_DIR: /codex-legacy/605bd31c
      COGNILODE_CODEX_LEGACY_BINARY_SHA256: 11de0a3b7a8fb6a6f6513b06892eab0cff9b98524960fa2a065cdfbf894b7539
      COGNILODE_CODEX_LEGACY_RUST_TREE: b092910d25163510dc31e3a387f3090365fc826f
      CARGO_TARGET_DIR: /cargo-target
      CARGO_BUILD_JOBS: "4"
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - company_codex_release:/codex
