      AWS_SHARED_CREDENTIALS_FILE: /home/worker/.aws/credentials
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: "!/runtime/source/current/codex-backend-sdk/scripts/cognilode-git-credential-helper"
    volumes:
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - ${COMPANY_RUNTIME_ROOT}/worker:/runtime/worker
      - company_deploy_custody:/deploy:ro
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro
    depends_on:
      - source-sync
      - credential-sync

