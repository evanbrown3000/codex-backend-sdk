services:
  http-gate:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-http-gate]
    command:
      - --socket
      - /runtime/http-gate/gate.sock
      - --state
      - /runtime/http-gate
      - --fallback-log
      - /runtime/http-gate/fallback.jsonl
      - --environment
      - ${COGNILODE_ENVIRONMENT_ID}
      - --aws
      - /usr/bin/aws
    environment:
      HOME: /home/worker
      COGNILODE_HTTP_GATE_BYPASS: "1"
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro

  credential-sync:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-central-credential-sync]
    command:
      - --credential
      - cognilode/chatmode/codex-auth=/home/worker/.codex/auth.json
      - --credential
      - cognilode/http-gate-operator-token=/home/worker/.config/cognilode/operator-bearer
      - --credential
      - cognilode/population/authority/cloudflare-pages-deploy-token=/deploy/pages-token.json
      - --credential
      - /cognilode/agent-credentials/cloudflare/full-admin=/deploy/worker-token.json
      - --credential
      - cognilode/http-gate-operator-token=/deploy/operator-bearer
      - --credential
      - cognilode/memory-drive/rclone-config#rclone_config=/memory-auth/rclone.conf
      - --writer-secret
      - cognilode/chatmode/codex-auth
      - --writer-secret
      - cognilode/memory-drive/rclone-config
    environment:
      HOME: /home/worker
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - company_auth:/home/worker/.codex
      - company_operator:/home/worker/.config/cognilode
      - company_deploy_custody:/deploy
      - memory_drive_auth:/memory-auth
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro

  provider-transport:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    cpus: 1
    mem_limit: 2g
    pids_limit: 192
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-provider-transport]
    command: [--socket, /runtime/provider.sock]
    environment:
      HOME: /home/worker
      CODEX_HOME: /home/worker/.codex
      PYTHONPATH: /company/codex-backend-sdk/gate
      COGNILODE_HTTP_GATE_SOCKET: /runtime/http-gate/gate.sock
      COGNILODE_HTTP_GATE_FALLBACK_LOG: /runtime/http-gate/fallback.jsonl
      COGNILODE_HTTP_GATE_POLICY_FILE: /runtime/http-gate/policy.json
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
      COGNILODE_ENVIRONMENT_ID: ${COGNILODE_ENVIRONMENT_ID}
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - company_auth:/home/worker/.codex
      - company_browser:/custody/browser:ro
      - company_operator:/home/worker/.config/cognilode:ro
      - ${COMPANY_RUNTIME_ROOT}/worker:/home/worker/.local/share/cognilode
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
    depends_on:
      - http-gate
      - credential-sync

  chatmode:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    cpus: 1
    mem_limit: 2g
    pids_limit: 192
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-company-chatmode-runtime]
    environment:
      HOME: /home/worker
      PYTHONPATH: /company/codex-backend-sdk/gate
      COGNILODE_HTTP_GATE_SOCKET: /runtime/http-gate/gate.sock
      COGNILODE_HTTP_GATE_FALLBACK_LOG: /runtime/http-gate/fallback.jsonl
      COGNILODE_HTTP_GATE_POLICY_FILE: /runtime/http-gate/policy.json
      COGNILODE_PROVIDER_SOCKET: /runtime/provider.sock
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
      COGNILODE_ENVIRONMENT_ID: ${COGNILODE_ENVIRONMENT_ID}
      COGNILODE_COMPANY_ROOT: /company
      COGNILODE_B4PT0R_SDK_ROOT: /company/codex-backend-sdk
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - company_operator:/home/worker/.config/cognilode:ro
      - ${COMPANY_RUNTIME_ROOT}/worker:/home/worker/.local/share/cognilode
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro
    depends_on:
      - provider-transport

  source-sync:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-company-source-sync]
    environment:
      HOME: /home/worker
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_SOURCE_SYNC_INTERVAL: "300"
      COGNILODE_CODEX_SOURCE_COMMIT: 852bc2da4479b353913c894a9ecfc65a9d8764c8
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro

  codex-builder:
    image: rust:1.95-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
    restart: unless-stopped
    network_mode: bridge
    user: "0:0"
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-company-codex-builder]
    environment:
      HOME: /root
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_CODEX_SOURCE_COMMIT: 852bc2da4479b353913c894a9ecfc65a9d8764c8
      COGNILODE_CODEX_INSTALL_ROOT: /codex
      CARGO_TARGET_DIR: /cargo-target
      CARGO_BUILD_JOBS: "4"
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - company_codex_release:/codex
      - company_codex_target:/cargo-target
      - company_cargo_registry:/usr/local/cargo/registry
      - company_cargo_git:/usr/local/cargo/git
    depends_on:
      - source-sync

  site-publisher:
    image: node:22-bookworm
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-company-site-publisher]
    environment:
      HOME: /tmp
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_CLOUDFLARE_TOKEN_FILE: /deploy/pages-token.json
      COGNILODE_CLOUDFLARE_WORKER_TOKEN_FILE: /deploy/worker-token.json
      COGNILODE_OPERATOR_TOKEN_FILE: /deploy/operator-bearer
      PATH: /usr/bin:/usr/local/bin:/bin
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - company_deploy_custody:/deploy:ro
    depends_on:
      - source-sync
      - credential-sync

  taskflow-worker:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /company/codex-backend-sdk
    entrypoint: [python3, /company/codex-backend-sdk/scripts/cognilode-company-taskflow-runtime]
    environment:
      HOME: /home/worker
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_TASKFLOW_PLAN_ROOT: /runtime/worker/rpe-runs
      COGNILODE_TASKFLOW_SECRETARY_ROOT: /runtime/worker/taskflow-secretary
      COGNILODE_LLM_GOVERNANCE_ROOT: /runtime/worker/llm-governance
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
      COGNILODE_TASKFLOW_ATTACHMENT_S3_BUCKET: cognilode-ephemeral-artifacts-362928919715-us-west-2
      COGNILODE_CODEX_BIN: /codex/bin/codex
      COGNILODE_CENTRAL_ROLLOUT_HELPER: /codex/bin/central-rollouts
      CODEX_HOME: /home/worker/.codex
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - company_auth:/home/worker/.codex
      - company_operator:/home/worker/.config/cognilode:ro
      - company_codex_release:/codex:ro
      - ${COMPANY_RUNTIME_ROOT}/worker:/runtime/worker
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro
    depends_on:
      - source-sync
      - codex-builder
      - credential-sync

  codex-rollout-sync:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    entrypoint: [python3, /codex/bin/central-rollouts, daemon]
    environment:
      HOME: /home/worker
      CODEX_HOME: /home/worker/.codex
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
    volumes:
      - company_codex_release:/codex:ro
      - company_auth:/home/worker/.codex
      - company_operator:/home/worker/.config/cognilode:ro
    depends_on:
      - codex-builder
      - credential-sync

  memory:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /runtime/source/current/memory-stock-canonical
    entrypoint: [python3, /runtime/source/current/memory-stock-canonical/deploy/conversation-vacuum/company_memory_runtime.py]
    environment:
      HOME: /home/worker
      PYTHONPATH: /runtime/source/current/memory-stock-canonical/src
      COGNILODE_VACUUM_HOME: /workspace/company/runtime/conversation-vacuum
      COGNILODE_VACUUM_ROOTS: /workspace/company/data/conversation-imports
      COGNILODE_PRIVACY_EXPORT_DIR: /workspace/company/data/privacy-imports
      RCLONE_CONFIG: /memory-auth/rclone.conf
      COGNILODE_ENABLE_D1_BRIDGE: "0"
      COGNILODE_ENABLE_OPENAI_LIBRARY: "0"
      COGNILODE_DRIVE_WEB_UPLOAD: "0"
      COGNILODE_MEMORY_ARCHIVE_BUCKET: cognilode-conversation-visibility-362928919715-us-west-2
      DECISIONX_DERIVED_DB: /workspace/company/runtime/conversation-vacuum/decisionx-derived.sqlite3
    volumes:
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime:ro
      - memory_data:/workspace/company
      - memory_drive_auth:/memory-auth
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro
    depends_on:
      - source-sync
      - credential-sync

  rpe-worker:
    image: ${COGNILODE_WORKSPACE_IMAGE:-cognilode-standard-workspace:2026-09-28}
    restart: unless-stopped
    network_mode: bridge
    user: "${COMPANY_UID:-1000}:${COMPANY_GID:-1000}"
    working_dir: /runtime/source/current/research-plan-execute
    entrypoint: [sh, -c]
    command:
      - >-
        mkdir -p /runtime/worker/rpe-intake /runtime/worker/rpe-runs &&
        cp -n /runtime/source/current/research-plan-execute/deploy/unified-operation.goal.md
        /runtime/worker/rpe-intake/unified-operation.goal.md &&
        exec python3 -m recursive_rpe.autonomy
        --inbox /runtime/worker/rpe-intake
        --runs /runtime/worker/rpe-runs --interval 60 --parallel 4
    environment:
      HOME: /home/worker
      PYTHONPATH: /runtime/source/current/research-plan-execute/src:/runtime/source/current/modified-codex-runtime/src:/runtime/source/current/taskflow-orchestration-history/src
      COGNILODE_COMPANY_SOURCE_ROOT: /runtime/source
      COGNILODE_REPOSITORIES_ROOT: /runtime/source/current
      COGNILODE_RPE_PROVIDER: chatgpt.com
      COGNILODE_TASKFLOW_DISPATCH_CLI: /company/codex-backend-sdk/scripts/cognilode-taskflow-dispatch
      COGNILODE_TASKFLOW_SECRETARY_COMMAND: python3 -m modified_codex.taskflow_secretary submit
      COGNILODE_OPERATOR_TOKEN_FILE: /home/worker/.config/cognilode/operator-bearer
      COGNILODE_TASKFLOW_ATTACHMENT_S3_BUCKET: cognilode-ephemeral-artifacts-362928919715-us-west-2
      COGNILODE_AWS_CLI: /usr/bin/aws
      COGNILODE_TASKFLOW_SECRETARY_ROOT: /runtime/worker/taskflow-secretary
      COGNILODE_LLM_GOVERNANCE_ROOT: /runtime/worker/llm-governance
      COGNILODE_CODEX_BIN: /codex/bin/codex
    volumes:
      - ${COMPANY_REPOS_ROOT}:/company:ro
      - ${COMPANY_RUNTIME_ROOT}/shared:/runtime
      - ${COMPANY_RUNTIME_ROOT}/worker:/runtime/worker
      - ${AWS_AUTH_ROOT}:/home/worker/.aws:ro
      - company_auth:/home/worker/.codex
      - company_operator:/home/worker/.config/cognilode:ro
      - company_codex_release:/codex:ro
    depends_on:
      - source-sync
      - credential-sync
      - codex-builder

volumes:
  company_auth:
  company_browser:
  company_operator:
  company_deploy_custody:
  company_codex_release:
  company_codex_target:
  company_cargo_registry:
  company_cargo_git:
  memory_data:
  memory_drive_auth:
