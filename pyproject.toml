[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-backend-sdk"
version = "0.9.8"
description = "Unofficial Python SDK for the ChatGPT Codex backend API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["openai", "codex", "chatgpt", "llm", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "websocket-client>=1.8",
    "cryptography>=42.0",
]

[project.scripts]
b4pt0r = "codex_backend_sdk.cli:main"
b4pt0r-app-server = "codex_backend_sdk.app_server_bridge:main"
cognilode-b4pt0r-app-server = "codex_backend_sdk.app_server_bridge:main"
b4pt0r-provider-broker = "codex_backend_sdk.provider_broker:main"
b4pt0r-desktop = "codex_backend_sdk.desktop_launcher:main"
cognilode-credential-custody = "codex_backend_sdk.credential_custody_cli:main"

[project.optional-dependencies]
openai    = [
    "openai>=3.16.1; python_version >= '3.10'",
    "openai>=1.0,<3.0; python_version < '3.10'",
]
dev       = [
    "pytest>=7.0",
    "openai>=3.16.1; python_version >= '3.10'",
    "openai>=1.0,<3.0; python_version < '3.10'",
]

[tool.hatch.build.targets.wheel]
packages = ["codex_backend_sdk"]
